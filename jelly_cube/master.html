<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Presentation</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; background: #000; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        #fade-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
        .fade-in { opacity: 0; }
        .fade-out { opacity: 1; }
        #record-btn {
            position: absolute; top: 20px; right: 20px; z-index: 10000;
            padding: 10px 20px; background: rgba(255,255,255,0.1); color: #fff;
            border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
            font-family: 'JetBrains Mono', monospace, sans-serif; cursor: pointer;
            transition: all 0.2s ease;
        }
        #record-btn:hover { background: rgba(255,255,255,0.2); border-color: #ffd43b; color: #ffd43b; }
    </style>
</head>
<body>
    <button id="record-btn">Press R to Record Combined Video</button>
    <div id="fade-overlay" class="fade-out"></div>
    <iframe id="viewer"></iframe>

    <script>
        const scenes = ['index.html', 'scene2b.html', 'scene2.html', 'scene_05_06.html'];
        let currentIdx = 0;
        const viewer = document.getElementById('viewer');
        const overlay = document.getElementById('fade-overlay');
        let isRecording = false;
        let mediaRecorder = null;
        let chunks = [];

        function loadScene(idx) {
            if (idx >= scenes.length) {
                if (isRecording) stopRecording();
                return;
            }
            overlay.classList.remove('fade-in');
            overlay.classList.add('fade-out');
            
            setTimeout(() => {
                viewer.src = scenes[idx];
                viewer.onload = () => {
                    if (isRecording) {
                        viewer.contentWindow.postMessage('HIDE_UI', '*');
                    }
                    overlay.classList.remove('fade-out');
                    overlay.classList.add('fade-in');
                };
            }, 1000);
        }

        window.addEventListener('message', (e) => {
            if (e.data === 'SCENE_END') {
                currentIdx++;
                loadScene(currentIdx);
            }
        });

        async function startRecording() {
            try {
                // Request screen sharing for the current tab
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: { displaySurface: "browser" }, 
                    audio: false,
                    preferCurrentTab: true
                });
                
                let options = { mimeType: 'video/webm; codecs=vp9' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }
                
                mediaRecorder = new MediaRecorder(stream, options);
                chunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'Combined_Presentation.webm';
                    a.click();
                    stream.getTracks().forEach(track => track.stop());
                };
                
                document.getElementById('record-btn').style.display = 'none';
                mediaRecorder.start();
                isRecording = true;
                currentIdx = 0;
                loadScene(currentIdx);
            } catch (err) {
                console.error("Error starting recording:", err);
                alert("Screen recording was denied or failed.");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            document.getElementById('record-btn').style.display = 'block';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'r' && !isRecording) {
                startRecording();
            }
        });
        document.getElementById('record-btn').addEventListener('click', () => {
            if (!isRecording) startRecording();
        });

        // Initial load
        loadScene(0);
    </script>
</body>
</html>
